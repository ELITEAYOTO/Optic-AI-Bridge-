name: Rustfmt probe

on:
  push:
    branches:
      - hardening/phase-0-1-contracts

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Produce rustfmt patch
        run: |
          cargo fmt --all
          git diff -- crates > rustfmt.patch
      - name: Upload rustfmt patch
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: error
          retention-days: 1
