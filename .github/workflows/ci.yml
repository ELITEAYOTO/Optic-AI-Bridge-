name: CI

on:
  push:
    branches: [main, "bootstrap/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          rustup default 1.99.0
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Validate PowerShell installer scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            [scriptblock]::Create((Get-Content -Raw -LiteralPath $_.FullName)) | Out-Null
          }
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Characterize isolated toolchain compatibility
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OPTIC_REQUIRE_HOSTED_TOOLCHAINS: "1"
        run: |
          cargo test --locked -p optic-bridge-app --test toolchain_isolation_compat_windows -- --nocapture
          cargo test --locked -p optic-bridge-app --test toolchain_runtime_dependencies_windows -- --nocapture
      - name: Prove capability-free AppContainer loopback denial
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OPTIC_REQUIRE_HOSTED_TOOLCHAINS: "1"
        run: cargo test --locked -p optic-bridge-app --test appcontainer_network_isolation_windows -- --nocapture
      - name: Build bridge binaries for MCP and installer smokes
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --locked -p optic-bridge-app -j 1
      - name: Smoke isolated Node doctor with TEMP-only environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          $workspace = Join-Path $env:GITHUB_WORKSPACE 'target\isolated-node-temp-only-doctor'
          if (Test-Path -LiteralPath $workspace) { Remove-Item -LiteralPath $workspace -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          $savedTmp = $env:TMP
          try {
            Remove-Item Env:TMP -ErrorAction SilentlyContinue
            if ([string]::IsNullOrWhiteSpace($env:TEMP)) {
              throw 'Windows runner unexpectedly has no TEMP variable.'
            }
            .\scripts\Test-OpticAIBridge.ps1 `
              -BridgePath '.\target\debug\optic-bridge.exe' `
              -Workspace $workspace `
              -IsolationLauncherPath '.\target\debug\optic-bridge-isolation-launcher.exe' `
              -IsolatedNodePath $node
          }
          finally {
            if ($null -eq $savedTmp) {
              Remove-Item Env:TMP -ErrorAction SilentlyContinue
            }
            else {
              $env:TMP = $savedTmp
            }
          }
      - name: Smoke real isolated Node MCP admission
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          $fixtureRoot = Join-Path $env:GITHUB_WORKSPACE 'target\isolated-node-mcp-smoke'
          .\scripts\Test-IsolatedNodeMcp.ps1 `
            -BridgePath '.\target\debug\optic-bridge.exe' `
            -NodePath $node `
            -FixtureRoot $fixtureRoot
      - name: Smoke profiled Node MCP approval
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          $fixtureRoot = Join-Path $env:GITHUB_WORKSPACE 'target\tool-profile-mcp-smoke'
          .\scripts\Test-ToolProfileMcp.ps1 `
            -BridgePath '.\target\debug\optic-bridge.exe' `
            -NodePath $node `
            -FixtureRoot $fixtureRoot
      - name: Smoke real Git integration MCP binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $git = (Get-Command git.exe -ErrorAction Stop).Source
          $fixtureRoot = Join-Path $env:GITHUB_WORKSPACE 'target\git-integration-mcp-smoke'
          .\scripts\Test-GitIntegrationMcp.ps1 `
            -BridgePath '.\target\debug\optic-bridge.exe' `
            -GitPath $git `
            -FixtureRoot $fixtureRoot
      - name: Validate ChatGPT installer profiles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fixtureRoot = Join-Path $env:GITHUB_WORKSPACE 'target\installer-profile-smoke'
          .\scripts\Test-InstallerProfiles.ps1 `
            -BridgePath '.\target\debug\optic-bridge.exe' `
            -IsolationLauncherPath '.\target\debug\optic-bridge-isolation-launcher.exe' `
            -PluginTemplatePath '.\packaging\chatgpt-plugin' `
            -FixtureRoot $fixtureRoot
      - name: Stage ChatGPT Desktop Node validation bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'target\chatgpt-desktop-node-validation-bundle'
          if (Test-Path -LiteralPath $bundle) { Remove-Item -LiteralPath $bundle -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item '.\target\debug\optic-bridge.exe' $bundle
          Copy-Item '.\target\debug\optic-bridge-isolation-launcher.exe' $bundle
          Copy-Item '.\scripts\Install-OpticAIBridge.ps1' $bundle
          Copy-Item '.\scripts\Test-OpticAIBridge.ps1' $bundle
          Copy-Item '.\scripts\Uninstall-OpticAIBridge.ps1' $bundle
          Copy-Item '.\scripts\Prepare-ChatGPTDesktopNodeSmoke.ps1' $bundle
          Copy-Item '.\packaging\chatgpt-plugin' (Join-Path $bundle 'plugin') -Recurse
          @(
            "source_sha=${{ github.sha }}",
            "run_id=${{ github.run_id }}",
            "run_attempt=${{ github.run_attempt }}",
            "ref=${{ github.ref }}"
          ) | Set-Content -LiteralPath (Join-Path $bundle 'SOURCE.txt') -Encoding ascii
      - name: Upload ChatGPT Desktop Node validation bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: optic-chatgpt-desktop-node-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/chatgpt-desktop-node-validation-bundle
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - name: Download ChatGPT Desktop Node validation bundle for round-trip proof
        if: runner.os == 'Windows'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: optic-chatgpt-desktop-node-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/chatgpt-desktop-node-validation-roundtrip
      - name: Verify ChatGPT Desktop Node validation bundle round-trip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $roundtrip = Join-Path $env:GITHUB_WORKSPACE 'target\chatgpt-desktop-node-validation-roundtrip'
          $requiredFiles = @(
            'optic-bridge.exe',
            'optic-bridge-isolation-launcher.exe',
            'Install-OpticAIBridge.ps1',
            'Test-OpticAIBridge.ps1',
            'Uninstall-OpticAIBridge.ps1',
            'Prepare-ChatGPTDesktopNodeSmoke.ps1',
            'SOURCE.txt',
            'plugin\.codex-plugin\plugin.json',
            'plugin\assets\optic-ai-bridge.png.b64'
          )
          foreach ($relative in $requiredFiles) {
            $path = Join-Path $roundtrip $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Validation artifact round-trip is missing required file: $relative"
            }
          }
          $sourceSha = (Get-Content -LiteralPath (Join-Path $roundtrip 'SOURCE.txt') | Where-Object { $_ -like 'source_sha=*' }) -replace '^source_sha=', ''
          if ($sourceSha -ne '${{ github.sha }}') {
            throw "Validation artifact source mismatch. expected=${{ github.sha }} observed=$sourceSha"
          }

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Check advisories, licenses, bans and sources
        run: cargo deny check
