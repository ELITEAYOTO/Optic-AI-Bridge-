name: CI

on:
  push:
    branches: [main, "bootstrap/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          rustup default 1.99.0
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Check advisories, licenses, bans and sources
        run: cargo deny check

  canonical-files:
    name: Temporary canonical files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          rustup default 1.99.0
      - name: Generate canonical files
        run: |
          cargo fmt --all
          cargo generate-lockfile
          mkdir -p export/crates/optic-bridge-app/src
          mkdir -p export/crates/optic-bridge-mcp/src
          cp crates/optic-bridge-app/src/main.rs export/crates/optic-bridge-app/src/main.rs
          cp crates/optic-bridge-mcp/src/server.rs export/crates/optic-bridge-mcp/src/server.rs
          cp crates/optic-bridge-mcp/src/transport.rs export/crates/optic-bridge-mcp/src/transport.rs
          cp Cargo.lock export/Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: phase1b-canonical-files
          path: export
          retention-days: 1
          if-no-files-found: error
