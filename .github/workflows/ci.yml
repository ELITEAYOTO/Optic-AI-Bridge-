name: CI

on:
  push:
    branches: [main, "bootstrap/**"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          rustup default 1.99.0
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Check advisories, licenses, bans and sources
        run: cargo deny check

  canonical-runtime:
    name: Temporary Phase 1C canonical runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase-1/process-lifecycle
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          rustup default 1.99.0
      - name: Fix overflow terminal classification and format
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/optic-bridge-runtime/src/process.rs')
          text = path.read_text()
          old = '''    let _ = stdout_task.await;\n    let _ = stderr_task.await;\n    if let Ok(mut state) = record.state.lock() {\n        *state = JobState { status, exit_code };\n    }\n'''
          new = '''    let _ = stdout_task.await;\n    let _ = stderr_task.await;\n    let status = if status == ProcessStatus::Exited\n        && record.output_overflow.load(Ordering::Acquire)\n    {\n        ProcessStatus::OutputLimitExceeded\n    } else {\n        status\n    };\n    if let Ok(mut state) = record.state.lock() {\n        *state = JobState { status, exit_code };\n    }\n'''
          if old not in text:
              raise SystemExit('expected monitor snippet not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo generate-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock \
            crates/optic-bridge-core/src/ids.rs \
            crates/optic-bridge-core/src/limits.rs \
            crates/optic-bridge-runtime/src/process.rs \
            crates/optic-bridge-runtime/src/task_lease_registry.rs
          if git diff --cached --quiet; then
            echo "Canonical runtime files already committed."
          else
            git commit -m "fix: finalize bounded process lifecycle runtime"
            git push origin HEAD:phase-1/process-lifecycle
          fi
