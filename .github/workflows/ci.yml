name: CI

on:
  push:
    branches: [main, "bootstrap/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
          rustup default 1.99.0
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Validate PowerShell installer scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            [scriptblock]::Create((Get-Content -Raw -LiteralPath $_.FullName)) | Out-Null
          }
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Characterize isolated toolchain compatibility
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OPTIC_REQUIRE_HOSTED_TOOLCHAINS: "1"
        run: |
          cargo test --locked -p optic-bridge-app --test toolchain_isolation_compat_windows -- --nocapture
          cargo test --locked -p optic-bridge-app --test toolchain_runtime_dependencies_windows -- --nocapture
      - name: Prove capability-free AppContainer loopback denial
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OPTIC_REQUIRE_HOSTED_TOOLCHAINS: "1"
        run: cargo test --locked -p optic-bridge-app --test appcontainer_network_isolation_windows -- --nocapture
      - name: Build bridge binary for Git integration MCP smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --locked -p optic-bridge-app -j 1
      - name: Smoke real Git integration MCP binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $git = (Get-Command git.exe -ErrorAction Stop).Source
          $fixtureRoot = Join-Path $env:GITHUB_WORKSPACE 'target\git-integration-mcp-smoke'
          .\scripts\Test-GitIntegrationMcp.ps1 `
            -BridgePath '.\target\debug\optic-bridge.exe' `
            -GitPath $git `
            -FixtureRoot $fixtureRoot
      - name: Validate ChatGPT installer Git integration profiles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fixtureRoot = Join-Path $env:GITHUB_WORKSPACE 'target\installer-profile-smoke'
          .\scripts\Test-InstallerProfiles.ps1 `
            -BridgePath '.\target\debug\optic-bridge.exe' `
            -PluginTemplatePath '.\packaging\chatgpt-plugin' `
            -FixtureRoot $fixtureRoot

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Check advisories, licenses, bans and sources
        run: cargo deny check
