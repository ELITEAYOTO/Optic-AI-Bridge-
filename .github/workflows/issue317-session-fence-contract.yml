name: Research session revoke fence contract
on:
  push:
    branches: ['research/317-session-fence-contract-2026-10-23']
permissions:
  contents: read
jobs:
  real-registry:
    name: Actual registry admission/revoke / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust format and lint components
        shell: bash
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - name: Strict whole-workspace Rustfmt
        shell: bash
        run: cargo +1.99.0 fmt --all -- --check
      - name: Strict runtime crate Clippy
        shell: bash
        run: cargo +1.99.0 clippy --locked -p optic-bridge-runtime --all-targets -- -D warnings
      - name: Execute actual registry concurrency regressions (not a simulated model)
        shell: bash
        run: cargo +1.99.0 test --locked -p optic-bridge-runtime --lib authority_contract_tests -- --nocapture --test-threads=1
      - name: Record exact-source checkpoint
        shell: bash
        run: |
          echo "OPTIC317_REAL_REGISTRY sha=${GITHUB_SHA} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} os=${RUNNER_OS} test_only=true production_semantics_changed=false"
