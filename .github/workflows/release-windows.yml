name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0

      - name: Build release binaries
        shell: pwsh
        run: cargo build --locked --release -p optic-bridge-app

      - name: Build user bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD 'dist\Optic-AI-Bridge-windows-x64'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item 'target\release\optic-bridge.exe' $bundle
          Copy-Item 'target\release\optic-bridge-isolation-launcher.exe' $bundle
          Copy-Item 'scripts\Install-OpticAIBridge.ps1' $bundle
          Copy-Item 'scripts\Test-OpticAIBridge.ps1' $bundle
          Copy-Item 'scripts\Uninstall-OpticAIBridge.ps1' $bundle
          Copy-Item 'packaging\chatgpt-plugin' (Join-Path $bundle 'plugin') -Recurse
          @'
          Optic AI Bridge - Windows / ChatGPT Desktop

          1. Extract this ZIP.
          2. Open PowerShell in this folder.
          3. Run:
             .\Install-OpticAIBridge.ps1 -Workspace "C:\path\to\your\git-repository"
          4. Fully restart ChatGPT Desktop.
          5. In a new normal Chat, type:
             @Optic AI Bridge Inspect the current workspace without modifying anything.

          No OpenAI API key, tunnel, Node.js, Python or Rust compiler is required for this release bundle.
          The bundle includes Optic's internal AppContainer isolation launcher as a sibling of the bridge; its presence grants no interpreter or repository-code authority by itself.
          Mutating file tools are limited to the workspace scratch/ prefix by default and still require ChatGPT approval.
          Exact-head Git integration is off by default. On an exact Git repository root, add -EnableGitIntegration to enable git_integration_status plus prompt-gated git_integrate.
          '@ | Set-Content -LiteralPath (Join-Path $bundle 'README-FIRST.txt') -Encoding UTF8

          $zip = Join-Path $PWD 'dist\Optic-AI-Bridge-windows-x64.zip'
          Compress-Archive -Path "$bundle\*" -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  Optic-AI-Bridge-windows-x64.zip" | Set-Content -LiteralPath 'dist\Optic-AI-Bridge-windows-x64.zip.sha256' -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            'dist\Optic-AI-Bridge-windows-x64.zip' `
            'dist\Optic-AI-Bridge-windows-x64.zip.sha256' `
            --repo "${{ github.repository }}" `
            --verify-tag `
            --prerelease `
            --generate-notes `
            --title "Optic AI Bridge ${{ github.ref_name }}"
