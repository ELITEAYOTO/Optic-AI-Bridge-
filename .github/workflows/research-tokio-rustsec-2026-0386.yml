name: Research Tokio RustSec upgrade exact lockfile
on:
  push:
    branches: ['research/tokio-rustsec-2026-0386-upgrade-2026-10-23']
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Resolve only the advisory-fixed Tokio
        run: cargo +1.99.0 update -p tokio --precise 1.53.3
      - name: Show exact minimal Cargo lock change
        run: git diff -- Cargo.lock
      - name: Ensure lockfile remains valid
        run: cargo +1.99.0 metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Print exact resolved package
        run: cargo +1.99.0 tree --locked -i tokio
      - name: Source proof
        run: echo "TOKIO_RUSTSEC_UPGRADE sha=${GITHUB_SHA} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
