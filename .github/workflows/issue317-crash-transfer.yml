name: Issue 317 crash before native ACK
on:
  push:
    branches: ['research/317-crash-before-native-ack-2026-10-24', 'research/317-service-preowned-native-job-2026-10-24', 'research/317-limited-launcher-job-rights-2026-10-24']
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Rust 1.99
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
          rustup default 1.99.0
          rustc -Vv
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p optic-bridge-runtime --all-targets --all-features -- -D warnings
      - run: cargo test --locked -p optic-bridge-runtime --lib
      - name: Build exact fixture and supervise controlled native crash schedules
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --locked -p optic-bridge-runtime --lib --no-run --message-format=json > fixture-build.jsonl
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $build = Get-Content fixture-build.jsonl | ForEach-Object { $_ | ConvertFrom-Json }
          $exe = @($build | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'optic_bridge_runtime' -and $_.executable })
          if ($exe.Count -ne 1) { throw 'Ambiguous test executable' }
          python scripts/research/issue317_crash_transfer.py --test-exe $exe[0].executable --output crash-evidence
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Full Windows workspace validation
        if: runner.os == 'Windows'
        run: cargo test --locked --workspace
      - name: Preserve manifest and first failures
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue317-crash-evidence-${{ github.sha }}
          path: |
            crash-evidence/
            fixture-build.jsonl
