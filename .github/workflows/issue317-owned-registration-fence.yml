name: Research authority-owned registration fence
on:
  push:
    branches: ['research/317-owned-registration-fence-2026-10-23']
permissions:
  contents: read
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pin Rust 1.99 with Rustfmt and Clippy
        shell: bash
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - name: Whole-workspace strict formatting
        shell: bash
        run: cargo +1.99.0 fmt --all -- --check
      - name: Strict runtime Clippy
        shell: bash
        run: cargo +1.99.0 clippy --locked -p optic-bridge-runtime --all-targets --all-features -- -D warnings
      - name: Four authority/owner ordering regressions
        shell: bash
        run: cargo +1.99.0 test --locked -p optic-bridge-runtime --lib research_owner_fence_ -- --nocapture --test-threads=1
      - name: Prior production-path lost-stop control
        shell: bash
        run: cargo +1.99.0 test --locked -p optic-bridge-runtime --lib cancellation_signals_uncertain_owner_without_discarding_proof_or_other_sessions -- --nocapture --test-threads=1
      - name: Exact source checkpoint
        shell: bash
        run: echo "OPTIC317_OWNER_FENCE sha=${GITHUB_SHA} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} os=${RUNNER_OS} test_only=true production_wired=false"
