name: Experimental Read Link Admission
on:
  pull_request:
    paths:
      - 'experiments/real-link-admission/**'
      - 'experiments/project-alpha/**'
      - 'experiments/francestudent-probe/server.py'
      - 'crates/optic-bridge-mcp/src/server.rs'
      - 'crates/optic-bridge-app/src/bin/optic_bridge_isolation_launcher.rs'
      - 'crates/optic-bridge-windows/**'
      - 'experiments/credential-lifecycle/lifecycle_core.py'
      - '.github/workflows/real-link-admission.yml'
permissions:
  contents: read
jobs:
  admission:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fixed fixture admission and retained cancellation accounting
        shell: pwsh
        run: |
          $env:PYTHONPATH = @('experiments/project-alpha', 'experiments/real-link-admission', 'experiments/credential-lifecycle') -join [IO.Path]::PathSeparator
          python -m unittest discover -s experiments/real-link-admission/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'read-link admission proof failed' }
  real-stdio:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build pinned real binary
        # The alpha must work with the actual user's installed Node version,
        # not just the newer runner image whose stat API can hide ACL gaps.
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'toolchain failed' }
          cargo build --locked -p optic-bridge-app --bins
          if ($LASTEXITCODE -ne 0) { throw 'binary build failed' }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: runner.os == 'Windows'
        with:
          node-version: '22.15.1'
          package-manager-cache: false
      - name: Frozen SDK and generated fixture proof
        shell: pwsh
        run: |
          python -m pip install -r experiments/host-probe/requirements.txt -c experiments/host-probe/constraints.txt
          if ($LASTEXITCODE -ne 0) { throw 'SDK install failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'SDK dependency check failed' }
          $env:PYTHONPATH = @('experiments/project-alpha', 'experiments/real-link-admission', 'experiments/credential-lifecycle') -join [IO.Path]::PathSeparator
          python -m unittest discover -s experiments/project-alpha/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'project alpha guard/admission proof failed' }
          python -m unittest discover -s experiments/real-link-admission/http_tests -v
          if ($LASTEXITCODE -ne 0) { throw 'local stop contract failed' }
          $Binary = if ($IsWindows) { 'target/debug/optic-bridge.exe' } else { 'target/debug/optic-bridge' }
          python experiments/real-link-admission/real_smoke.py $Binary
          if ($LASTEXITCODE -ne 0) { throw 'real generated fixture proof failed' }
          python experiments/project-alpha/supervision_smoke.py $Binary
          if ($LASTEXITCODE -ne 0) { throw 'native bounded operator supervision failed' }
          python experiments/project-alpha/permissions_smoke.py $Binary
          if ($LASTEXITCODE -ne 0) { throw 'operator JSON permission switches failed' }
          python experiments/project-alpha/supervision_pause_smoke.py $Binary
          if ($LASTEXITCODE -ne 0) { throw 'paused supervisor must not resurrect expired authority' }
          python experiments/project-alpha/edit_smoke.py $Binary
          if ($LASTEXITCODE -ne 0) { throw 'generated alpha project editing failed' }
          python experiments/project-alpha/http_edit_smoke.py $Binary
          if ($LASTEXITCODE -ne 0) { throw 'HTTP alpha project editing failed' }
          python experiments/project-alpha/http_edit_smoke.py $Binary 32768
          if ($LASTEXITCODE -ne 0) { throw 'alpha selected file-budget HTTP proof failed' }
          python experiments/project-alpha/runner_edit_smoke.py $Binary
          if ($LASTEXITCODE -ne 0) { throw 'alpha project runner failed' }
          if ($IsWindows) {
            python experiments/project-alpha/directory_smoke.py $Binary
            if ($LASTEXITCODE -ne 0) { throw 'native directory creation authorization failed' }
            $Node = (Get-Command node.exe -ErrorAction Stop).Source
            $env:OPTIC_STAGE_NODE = $Node
            cargo test --locked -p optic-bridge-windows private_stage_node_modules -- --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'native private Node build staging failed' }
            Remove-Item Env:OPTIC_STAGE_NODE
            python experiments/project-alpha/node_http_smoke.py $Binary $Node
            if ($LASTEXITCODE -ne 0) { throw 'native alpha Node task integration failed' }
            python experiments/project-alpha/runner_edit_smoke.py $Binary $Node
            if ($LASTEXITCODE -ne 0) { throw "Default Node runner failed" }
            python experiments/project-alpha/runner_edit_smoke.py $Binary $Node 32768
            if ($LASTEXITCODE -ne 0) { throw 'native alpha Node runner lifecycle failed' }
            python experiments/project-alpha/runner_supervised_smoke.py $Binary $Node
            if ($LASTEXITCODE -ne 0) { throw 'native supervised alpha lifecycle failed' }
            python experiments/project-alpha/runner_shutdown_smoke.py $Binary
            if ($LASTEXITCODE -ne 0) { throw 'native alpha blocked-output/expiry shutdown failed' }
            node --test experiments/project-alpha/viewer/viewer_policy.test.cjs
            if ($LASTEXITCODE -ne 0) { throw 'operator viewer policy failed' }
            $ElectronTools = Join-Path $env:RUNNER_TEMP 'optic-electron-viewer-tools'
            npm.cmd install --prefix $ElectronTools --save-dev --ignore-scripts --no-audit --no-fund electron@44.7.2
            if ($LASTEXITCODE -ne 0) { throw 'pinned external Electron test runtime install failed' }
            node (Join-Path $ElectronTools 'node_modules/electron/install.js')
            if ($LASTEXITCODE -ne 0) { throw 'Electron binary download failed' }
            python experiments/project-alpha/electron_viewer_smoke.py (Join-Path $ElectronTools 'node_modules/electron/dist/electron.exe')
            if ($LASTEXITCODE -ne 0) { throw 'native operator Electron viewer failed' }
            python experiments/project-alpha/electron_viewer_smoke.py (Join-Path $ElectronTools 'node_modules/electron/dist/electron.exe') 32768
            if ($LASTEXITCODE -ne 0) { throw 'native selected file-budget viewer failed' }
            # This package grants only fixed Node profiles and the operator viewer.
            # General private Electron remains an unchanged, separately failing
            # research gate in private-application-staging.yml. A viewer pass must
            # never be presented as support for that model-execution path.
          }
          python experiments/real-link-admission/http_smoke.py $Binary
          if ($LASTEXITCODE -ne 0) { throw 'HTTP real fixture proof failed' }
          python experiments/real-link-admission/runner_smoke.py $Binary
          if ($LASTEXITCODE -ne 0) { throw 'manual runner startup/stop failed' }
          Get-ChildItem experiments/real-link-admission/scripts -Filter '*.ps1' | ForEach-Object {
            [scriptblock]::Create((Get-Content -Raw -LiteralPath $_.FullName)) | Out-Null
          }
          Get-ChildItem experiments/project-alpha/scripts -Filter '*.ps1' | ForEach-Object {
            [scriptblock]::Create((Get-Content -Raw -LiteralPath $_.FullName)) | Out-Null
          }
      - name: Package exact tested Windows fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Stage = Join-Path $env:RUNNER_TEMP 'optic-fixed-read-package'
          $SourceZip = Join-Path $env:RUNNER_TEMP 'optic-fixed-read-source.zip'
          git archive --format=zip --output $SourceZip HEAD experiments/real-link-admission experiments/francestudent-probe/server.py experiments/francestudent-probe/probe_core.py experiments/francestudent-probe/scripts/Setup-FranceStudentProbe.ps1 experiments/credential-lifecycle/lifecycle_core.py experiments/session-resolver/proof_channel.py experiments/host-probe/requirements.txt experiments/host-probe/constraints.txt
          if ($LASTEXITCODE -ne 0) { throw 'fixed source archive failed' }
          Expand-Archive -LiteralPath $SourceZip -DestinationPath $Stage
          $BinDirectory = Join-Path $Stage 'packaging/fixed-read-test'
          New-Item -ItemType Directory -Path $BinDirectory | Out-Null
          Copy-Item -LiteralPath 'target/debug/optic-bridge.exe' -Destination (Join-Path $BinDirectory 'optic-bridge.exe')
          $Manifest = @{ source_commit = $env:GITHUB_SHA; binary_sha256 = (Get-FileHash -LiteralPath (Join-Path $BinDirectory 'optic-bridge.exe') -Algorithm SHA256).Hash }
          $Manifest | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $Stage 'FIXTURE_MANIFEST.json') -Encoding utf8
          $env:GITHUB_SHA | Set-Content -LiteralPath (Join-Path $Stage 'SOURCE_COMMIT.txt') -Encoding ascii
          $Package = Join-Path $env:RUNNER_TEMP 'Optic-Fixed-Read-Host-Test.zip'
          Compress-Archive -Path (Join-Path $Stage '*') -DestinationPath $Package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: Optic-Fixed-Read-Host-Test-${{ github.sha }}
          path: ${{ runner.temp }}/Optic-Fixed-Read-Host-Test.zip
          retention-days: 7
          if-no-files-found: error
      - name: Package exact tested project alpha
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $AlphaStage = Join-Path $env:RUNNER_TEMP 'optic-project-alpha-package'
          $AlphaSource = Join-Path $env:RUNNER_TEMP 'optic-project-alpha-source.zip'
          git archive --format=zip --output $AlphaSource HEAD experiments/project-alpha experiments/real-link-admission experiments/francestudent-probe/server.py experiments/francestudent-probe/probe_core.py experiments/francestudent-probe/scripts/Setup-FranceStudentProbe.ps1 experiments/credential-lifecycle/lifecycle_core.py experiments/session-resolver/proof_channel.py experiments/host-probe/requirements.txt experiments/host-probe/constraints.txt
          if ($LASTEXITCODE -ne 0) { throw 'alpha source archive failed' }
          Expand-Archive -LiteralPath $AlphaSource -DestinationPath $AlphaStage
          $AlphaBin = Join-Path $AlphaStage 'packaging/project-alpha'
          New-Item -ItemType Directory -Path $AlphaBin | Out-Null
          Copy-Item -LiteralPath 'target/debug/optic-bridge.exe' -Destination (Join-Path $AlphaBin 'optic-bridge.exe')
          Copy-Item -LiteralPath 'target/debug/optic-bridge-isolation-launcher.exe' -Destination (Join-Path $AlphaBin 'optic-bridge-isolation-launcher.exe')
          @{source_commit=$env:GITHUB_SHA; binary_sha256=(Get-FileHash -LiteralPath (Join-Path $AlphaBin 'optic-bridge.exe') -Algorithm SHA256).Hash; helper_sha256=(Get-FileHash -LiteralPath (Join-Path $AlphaBin 'optic-bridge-isolation-launcher.exe') -Algorithm SHA256).Hash; viewer_main_sha256=(Get-FileHash -LiteralPath (Join-Path $AlphaStage 'experiments/project-alpha/viewer/electron_main.cjs')).Hash; viewer_policy_sha256=(Get-FileHash -LiteralPath (Join-Path $AlphaStage 'experiments/project-alpha/viewer/viewer_policy.cjs')).Hash; file_budget='operator-file-budget-v1'; supervision='bounded-operator-lease-v1'; directory_creation='typed-absent-v1'; diagnostics='bounded-tool-outcomes-v1'; diagnostic_checkpoint='last-tool-v1'; text_replacement='single-exact-v1'; scope='generated-project-node-check-test-operator-electron-viewer'} | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $AlphaStage 'ALPHA_MANIFEST.json') -Encoding utf8
          $env:GITHUB_SHA | Set-Content -LiteralPath (Join-Path $AlphaStage 'SOURCE_COMMIT.txt') -Encoding ascii
          Copy-Item -LiteralPath 'experiments/project-alpha/SUPERVISED_HOST_TEST.md' -Destination (Join-Path $AlphaStage 'COMMENCER_ICI.md')
          $AlphaPackage = Join-Path $env:RUNNER_TEMP 'Optic-Project-Alpha.zip'
          Compress-Archive -Path (Join-Path $AlphaStage '*') -DestinationPath $AlphaPackage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: Optic-Project-Alpha-${{ github.sha }}
          path: ${{ runner.temp }}/Optic-Project-Alpha.zip
          retention-days: 7
          if-no-files-found: error
