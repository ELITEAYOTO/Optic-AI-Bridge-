name: Experimental Read Link Admission
on:
  pull_request:
    paths:
      - 'experiments/real-link-admission/**'
      - 'experiments/credential-lifecycle/lifecycle_core.py'
      - '.github/workflows/real-link-admission.yml'
permissions:
  contents: read
jobs:
  admission:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fixed fixture admission and retained cancellation accounting
        shell: pwsh
        run: |
          $env:PYTHONPATH = @('experiments/real-link-admission', 'experiments/credential-lifecycle') -join [IO.Path]::PathSeparator
          python -m unittest discover -s experiments/real-link-admission/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'read-link admission proof failed' }
  real-stdio:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build pinned real binary
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'toolchain failed' }
          cargo build --locked -p optic-bridge-app --bin optic-bridge
          if ($LASTEXITCODE -ne 0) { throw 'binary build failed' }
      - name: Frozen SDK and generated fixture proof
        shell: pwsh
        run: |
          python -m pip install -r experiments/host-probe/requirements.txt -c experiments/host-probe/constraints.txt
          if ($LASTEXITCODE -ne 0) { throw 'SDK install failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'SDK dependency check failed' }
          $Binary = if ($IsWindows) { 'target/debug/optic-bridge.exe' } else { 'target/debug/optic-bridge' }
          python experiments/real-link-admission/real_smoke.py $Binary
          if ($LASTEXITCODE -ne 0) { throw 'real generated fixture proof failed' }
