name: Issue 317 native observation uncertainty research

on:
  push:
    branches: ['research/317-native-observation-uncertain-2026-10-24', 'research/317-repeated-native-observation-2026-10-24']

permissions:
  contents: read

concurrency:
  group: issue317-uncertain-observation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Owned admission and native Job / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
          rustup default 1.99.0
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Strict runtime Clippy
        run: cargo clippy --locked -p optic-bridge-runtime --all-targets --all-features -- -D warnings
      - name: Full library regressions
        run: cargo test --locked -p optic-bridge-runtime --lib
      - name: Exact owned/kernel/stop integration test
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "OPTIC317_COMBINED_KERNEL_OWNER sha=${GITHUB_SHA} real-job=true child-resume=false gitread-wired=false"
          cargo test --locked -p optic-bridge-runtime --lib owned_registered_kernel_tree_stops_before_admission_drains -- --nocapture --test-threads=1
      - name: Exact uncertain OS observation and retained admission proof
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "OPTIC317_UNCERTAIN_NATIVE_OWNER sha=${GITHUB_SHA} fault=injected-win32-accounting proof=retained-until-positive gitread-wired=false"
          cargo test --locked -p optic-bridge-runtime --lib uncertain_kernel_accounting_retains_owned_admission_and_jobstore_until_retry_proves_empty -- --nocapture --test-threads=1
      - name: Repeated accounting failures retain native owner and quota
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "OPTIC317_REPEATED_OBSERVATION sha=${GITHUB_SHA} fault=injected-repeated query-count=4 recovery=test-only production-fix=false"
          cargo test --locked -p optic-bridge-runtime --lib repeated_native_accounting_failures_retain_owner_and_quota_before_recovery -- --nocapture --test-threads=1
      - name: Native created-before-mark false-terminal negative control
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "OPTIC317_PREMARK_NEGATIVE_CONTROL sha=${GITHUB_SHA} real-suspended-child=true negative-control=true production-fix=false"
          cargo test --locked -p optic-bridge-runtime --lib unmarked_native_creation_drop_reports_terminal_while_job_still_contains_child_negative_control -- --nocapture --test-threads=1
      - name: Conservative native prearm and empty-Job tradeoff
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "OPTIC317_PREARM_TRADEOFF sha=${GITHUB_SHA} proof=accounting-only guardian=false production-fix=false"
          cargo test --locked -p optic-bridge-runtime --lib prearmed_native_creation_drop_retains_quota_with_live_suspended_child -- --nocapture --test-threads=1
          cargo test --locked -p optic-bridge-runtime --lib prearmed_creation_without_child_retains_uncertain_quota_until_reconciliation -- --nocapture --test-threads=1
