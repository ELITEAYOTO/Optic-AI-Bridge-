name: H01 Guarded Grouped Parallel
on:
  pull_request:
    paths:
      - 'experiments/grouped-parallel/**'
      - 'experiments/francestudent-probe/**'
      - 'experiments/credential-lifecycle/**'
      - 'experiments/session-resolver/proof_channel.py'
      - 'experiments/host-probe/requirements.txt'
      - 'experiments/host-probe/constraints.txt'
      - '.github/workflows/grouped-parallel.yml'
permissions:
  contents: read
jobs:
  grouped:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - shell: pwsh
        run: |
          python -m pip install -r experiments/host-probe/requirements.txt -c experiments/host-probe/constraints.txt
          if ($LASTEXITCODE -ne 0) { throw 'install failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'dependency check failed' }
          $env:PYTHONPATH = 'experiments/grouped-parallel'
          python -m unittest discover -s experiments/grouped-parallel/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'group unit proof failed' }
          python experiments/grouped-parallel/smoke_groups.py
          if ($LASTEXITCODE -ne 0) { throw 'group MCP proof failed' }
          $env:PYTHONPATH = 'experiments/francestudent-probe'
          python -m unittest discover -s experiments/francestudent-probe/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Guard regressions failed' }
          python experiments/francestudent-probe/smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Guard MCP proof failed' }
          Get-ChildItem experiments/grouped-parallel/scripts -Filter '*.ps1' | ForEach-Object {
            [scriptblock]::Create((Get-Content -Raw -LiteralPath $_.FullName)) | Out-Null
          }
