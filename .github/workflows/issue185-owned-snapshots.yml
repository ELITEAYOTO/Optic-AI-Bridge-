name: Research Node owned process snapshots
on:
  push:
    branches: ['diag/issue-185-owned-snapshots']
permissions:
  contents: read
jobs:
  observe:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build exact native test and launcher
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { throw 'toolchain failed' }
          cargo +1.99.0 fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'format failed' }
          cargo +1.99.0 test --locked -p optic-bridge-app --test appcontainer_network_isolation_windows --no-run --message-format=json > network-build.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          $tests = @(Get-Content network-build.jsonl | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'appcontainer_network_isolation_windows' -and $_.executable })
          if ($tests.Count -ne 1) { throw 'test identity ambiguous' }
          "OPTIC185_TEST_EXE=$($tests[0].executable)" >> $env:GITHUB_ENV
      - name: Fixed snapshots, stop on first failure
        shell: pwsh
        timeout-minutes: 2
        run: python scripts/research/issue185_owned_snapshots.py --test-exe "$env:OPTIC185_TEST_EXE" --output evidence/owned-process-snapshots.json
      - name: Preserve original outcomes and partial observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optic185-owned-snapshots
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
